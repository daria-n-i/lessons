<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Homework · A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Ms+Madi&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7EBDD; --paper:#FFF8EE; --olive:#6E7836; --matcha:#B9C38A; --blush:#F4BFCB; --tomato:#E2442F;
  --cobalt:#2340C2; --choc:#4A2C21; --ink:#2B1A14; --line:#E4D3BE;
  --ok:#5E7A2A; --bad:#C23B26;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --cream:#2A1E19; --paper:#35271F; --ink:#F6EADB; --choc:#F1D9C2; --line:#4E3A2E; --cobalt:#8EA2FF; --olive:#C2CC8C; --tomato:#FF7A63; --blush:#E89AAC; --matcha:#6E7836; color-scheme:dark;}}
:root[data-theme="dark"]{ --cream:#2A1E19; --paper:#35271F; --ink:#F6EADB; --choc:#F1D9C2; --line:#4E3A2E; --cobalt:#8EA2FF; --olive:#C2CC8C; --tomato:#FF7A63; --blush:#E89AAC; --matcha:#6E7836; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Figtree,system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden}
img{max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2{font-family:"Darumadrop One","Arial Rounded MT Bold",sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;margin:0}
.dance span{display:inline-block}
.script{font-family:"Ms Madi","Snell Roundhand",cursive;color:var(--cobalt);font-size:clamp(34px,5vw,48px);line-height:1;margin:6px 0 0}
.ob{position:absolute;pointer-events:none;filter:drop-shadow(2px 4px 4px rgba(60,30,10,.18))}

/* hero */
.hero{position:relative;padding:70px 0 90px;overflow:hidden}
.hero h1{font-size:clamp(64px,15vw,168px);color:var(--tomato);position:relative;z-index:2;max-width:9ch}
.hero .script{font-size:clamp(44px,7vw,72px);margin-top:10px;position:relative;z-index:2}
.hero .hint{max-width:30ch;margin-top:26px;font-size:18px;position:relative;z-index:2}
.stripes{height:22px;background:repeating-linear-gradient(90deg,var(--olive) 0 22px,var(--blush) 22px 44px)}

/* sections */
section.task{padding:56px 0 34px;position:relative}
.head{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.head h2{font-size:clamp(40px,7vw,70px);color:var(--choc)}
.head .script{margin:0 0 4px}
.lead{max-width:60ch;margin:0 0 20px}
.card{background:var(--paper);border:2px solid var(--choc);border-radius:4px;padding:22px;position:relative}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.btn{background:var(--tomato);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--choc);border:2px solid var(--choc)}
.row-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* vocab flip */
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flip{background:var(--paper);border:2px solid var(--choc);border-radius:999px;padding:12px 10px;text-align:center;color:var(--ink);font-weight:700;font-size:17px;min-height:52px;transition:background .2s}
.flip:nth-child(3n+1){transform:rotate(-1.2deg)} .flip:nth-child(4n+2){transform:rotate(1.4deg)}
.flip.on{background:var(--blush);color:#3a1a14;font-weight:500}
.mini{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.mini span{font-family:"Ms Madi",cursive;font-size:32px;color:var(--cobalt);background:var(--paper);padding:2px 18px 4px;border-radius:4px;border:1.5px dashed var(--cobalt)}

/* antonyms */
.ant{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;max-width:560px}
.col{display:flex;flex-direction:column;gap:10px}
.chip{border:2px solid var(--choc);background:var(--paper);color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;text-align:left}
.chip.sel{background:var(--matcha);color:#232a0b}
.chip.done{background:var(--olive);color:#fff;border-color:var(--olive);cursor:default}
.chip.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* gaps */
ol.gaps{padding-left:22px;margin:0;display:flex;flex-direction:column;gap:12px}
select{font:inherit;font-weight:700;color:var(--cobalt);background:transparent;border:0;border-bottom:2px dashed var(--cobalt);padding:0 4px;min-width:120px;border-radius:0}
select.right{color:var(--ok);border-bottom-color:var(--ok)} select.wrong{color:var(--bad);border-bottom-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.bank span{background:var(--blush);color:#3a1a14;border-radius:4px;padding:3px 12px;font-weight:700;transform:rotate(-2deg)}
.bank span:nth-child(even){transform:rotate(2deg);background:var(--matcha);color:#232a0b}

/* choose */
.opt{display:inline-flex;gap:6px;vertical-align:middle}
.opt button{border:2px solid var(--choc);background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 12px;font-weight:700;font-size:15px}
.opt button.right{background:var(--olive);color:#fff;border-color:var(--olive)}
.opt button.wrong{background:var(--tomato);color:#fff;border-color:var(--tomato);text-decoration:line-through}

/* notes mockup */
.phone{max-width:380px;margin:0 auto;background:#FFFDF8;color:#222;border-radius:44px;border:10px solid #1d1a18;padding:26px 22px 30px;box-shadow:0 18px 40px rgba(60,30,10,.25)}
.phone .bar{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:14px}
.phone .back{color:#D9A400;font-weight:500}
.phone h3{font-family:Figtree,sans-serif;font-size:24px;margin:4px 0 14px}
.phone p{margin:0 0 12px;font-size:16px}
.phone .mut{color:#999;font-size:12px;text-align:center;margin-bottom:10px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}

/* zodiac */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.z{border:2px solid var(--choc);border-radius:4px;padding:16px;background:var(--paper);position:relative;text-align:left;color:var(--ink)}
.z .sym{font-size:34px;line-height:1;font-family:"Segoe UI Symbol","Apple Symbols",serif;color:var(--tomato)}
.z b{display:block;font-size:19px;margin-top:6px}
.z small{display:block;color:var(--choc);opacity:.8}
.z .el{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
.el.fire{background:var(--tomato)} .el.earth{background:var(--olive)} .el.air{background:var(--cobalt)} .el.water{background:#2C8A8A}
.z .trait{margin-top:10px;font-family:"Ms Madi",cursive;font-size:30px;color:var(--cobalt);min-height:34px;line-height:1.1}
.z .trait.hide{color:transparent;background:repeating-linear-gradient(-45deg,var(--blush) 0 6px,transparent 6px 12px);border-radius:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.legend span{font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;color:#fff}

/* articles */
.art{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.art div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:4px;padding:10px 12px}
.art .tog{display:flex;gap:4px}
.art .tog button{width:38px;height:34px;border:2px solid var(--choc);background:transparent;color:var(--ink);border-radius:6px;font-weight:700}
.art .tog button.right{background:var(--olive);border-color:var(--olive);color:#fff}
.art .tog button.wrong{background:var(--tomato);border-color:var(--tomato);color:#fff}
.rule{background:var(--blush);color:#3a1a14;border-radius:4px;padding:14px 18px;margin-bottom:18px;max-width:60ch;transform:rotate(-.6deg)}
.rule b{font-weight:700}

/* starters */
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.starters p{margin:0;padding:18px;border-radius:4px;font-weight:700;font-size:19px;background:var(--paper);border:2px solid var(--choc)}
.starters p:nth-child(3n+1){background:var(--tomato);color:#fff;border-color:var(--tomato)}
.starters p:nth-child(3n+2){background:var(--matcha);color:#232a0b;border-color:var(--matcha)}
.starters p em{font-style:normal;opacity:.6}

/* exit */
.exit{text-align:center;padding:70px 0 90px;position:relative}
.exit h2{font-size:clamp(46px,9vw,96px);color:var(--tomato)}
.circles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:30px auto 0;max-width:720px}
.circles button{width:118px;height:118px;border-radius:50%;border:2px solid var(--choc);background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;padding:8px}
.circles button.on{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.scale{display:flex;justify-content:center;gap:10px;margin-top:30px}
.scale button{width:52px;height:52px;border-radius:50%;border:2px solid var(--tomato);background:transparent;color:var(--tomato);font-weight:700;font-size:20px}
.scale button.on{background:var(--tomato);color:#fff}
.q{margin-top:34px;font-size:19px}


/* edvibe photos */
.board{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;margin:30px 0 8px;padding:10px 0}
.pol{background:#fff;padding:10px 10px 12px;box-shadow:0 8px 18px rgba(60,30,10,.18);width:190px;position:relative;margin:0;border:0;cursor:zoom-in}
.pol img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.pol.q img{object-fit:contain;background:#f6f1ea}
.pol::before{content:"";position:absolute;top:-11px;left:50%;width:70px;height:22px;margin-left:-35px;background:rgba(244,191,203,.75);transform:rotate(-3deg)}
.pol:nth-child(even)::before{background:rgba(185,195,138,.75);transform:rotate(4deg)}
.pol:nth-child(4n+1){transform:rotate(-3deg)} .pol:nth-child(4n+2){transform:rotate(2.5deg)} .pol:nth-child(4n+3){transform:rotate(-1deg)} .pol:nth-child(4n){transform:rotate(3.5deg)}
.zcards{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 18px;scroll-snap-type:x mandatory;margin-top:22px}
.zcards button{flex:0 0 220px;scroll-snap-align:start;border:0;padding:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden;box-shadow:0 6px 14px rgba(40,20,60,.2)}
.zcards img{display:block;width:100%}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px;align-items:start}
.sheet button{border:2px solid var(--choc);padding:0;background:var(--paper);border-radius:4px;overflow:hidden;cursor:zoom-in}
.sheet img{display:block;width:100%}
.lb{position:fixed;inset:0;z-index:50;background:rgba(30,15,10,.82);display:none;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sub{font-family:"Ms Madi",cursive;color:var(--cobalt);font-size:34px;margin:30px 0 0;line-height:1}

@media (max-width:640px){ .pol{width:150px} .twocol{grid-template-columns:1fr} .ant{gap:10px 12px} .hero{padding-top:40px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

.mt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 6px}
.mt .chip{font-family:"Ms Madi",cursive;font-size:28px;font-weight:400;padding:2px 18px 4px}
.mgrid{display:flex;flex-wrap:wrap;gap:26px 20px;justify-content:center;margin:26px 0 8px}
.pol.mp{cursor:pointer;text-align:center}
.pol.mp .cap{display:block;min-height:36px;font-family:"Ms Madi",cursive;font-size:26px;line-height:1.1;color:var(--cobalt);padding-top:6px}
.pol.mp.shake{animation:shake .35s}
.pol.mp.done{outline:3px solid var(--olive)}
.ru{display:block;font-size:14px;opacity:.7;margin-top:2px}

/* iPad / touch */
html{-webkit-text-size-adjust:100%}
body{font-size:19px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
.wrap{max-width:1040px;padding:0 28px}
.flip{min-height:68px;font-size:21px}
.vocab{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.chip{min-height:54px;font-size:21px;padding:10px 22px}
.mt{gap:14px}
.mt .chip{font-size:30px;padding:4px 24px 6px}
.mgrid{gap:30px 26px}
.pol.mp{width:min(30%,260px);min-width:200px}
ol.gaps{gap:20px;font-size:21px;line-height:1.9}
.blank{display:inline-block;min-width:150px;min-height:48px;vertical-align:middle;border:2px dashed var(--cobalt);border-radius:10px;background:transparent;color:var(--cobalt);font:inherit;font-weight:700;padding:2px 14px}
.blank.done{border-style:solid;border-color:var(--olive);background:var(--olive);color:#fff}
.blank.shake{animation:shake .35s}
.opt{gap:10px}
.opt button{min-height:48px;font-size:20px;padding:4px 20px}
.btn{min-height:52px;font-size:19px;padding:10px 26px}
.circles button{width:132px;height:132px;font-size:19px}
.scale button{min-width:60px;min-height:60px;font-size:22px}
.phone{max-width:420px}
@media (max-width:760px){.twocol{grid-template-columns:1fr}.pol.mp{width:44%;min-width:150px}}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin:26px 0 60px}
.hw{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink);background:var(--paper);border:2px solid var(--choc);border-radius:10px;padding:18px 20px;min-height:84px}
.hw b{font-family:"Darumadrop One",sans-serif;font-size:34px;color:var(--tomato);font-weight:400;line-height:1}
.hw span{font-size:21px;font-weight:700}
.hw i{margin-left:auto;font-style:normal;color:var(--cobalt);font-size:26px}
.note{color:var(--choc);font-weight:700;margin:30px 0}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <h1 class="dance">Homework</h1>
  <p class="script">level A1</p>
</div></header>
<div class="stripes"></div>
<main class="wrap">
  <div class="list" id="list"></div>
  <p class="note" id="note"></p>
</main>
<div class="stripes"></div>
<script>
document.querySelectorAll('.dance').forEach(el=>{const t=el.textContent;el.textContent='';
 [...t].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00A0':c;
  const r=[-5,3,-2,4,-3,2,-4,1][i%8],y=[0,-3,2,-1,3,-2,1,0][i%8];s.style.transform=`rotate(${r}deg) translateY(${y}px)`;el.appendChild(s)})});
// fallback list (used if GitHub API is unavailable)
const FALLBACK=[["01-people-words.html","Homework · people words"]];
const list=document.getElementById('list'),note=document.getElementById('note');
function card(file,title,n){const a=document.createElement('a');a.className='hw';a.href='a1/'+file;
  a.innerHTML='<b>'+String(n).padStart(2,'0')+'</b><span></span><i>→</i>';a.querySelector('span').textContent=title;list.appendChild(a)}
async function titleOf(file){try{const r=await fetch('a1/'+file);const t=await r.text();const m=t.match(/<title>([^<]*)<\/title>/i);return m?m[1].trim():file}catch(e){return file}}
(async()=>{
 let files=null;
 try{
  const user=location.hostname.split('.')[0];
  const seg=location.pathname.split('/')[1];
  const repo=(!seg||seg==='index.html')?user+'.github.io':seg;
  const r=await fetch('https://api.github.com/repos/'+user+'/'+repo+'/contents/a1');
  if(r.ok){files=(await r.json()).filter(f=>/\.html?$/i.test(f.name)).map(f=>f.name).sort()}
 }catch(e){}
 if(!files||!files.length){FALLBACK.forEach(([f,t],i)=>card(f,t,i+1));return}
 const titles=await Promise.all(files.map(titleOf));
 files.forEach((f,i)=>card(f,titles[i],i+1));
 if(!files.length)note.textContent='No homework yet.';
})();
</script>
</body>
</html>
